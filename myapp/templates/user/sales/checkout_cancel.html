{% extends 'base.html' %}
{% load static %}

{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'index' %}">
      <img src="{% static 'images/big_logo_black.png' %}" alt="Ovalia" height="40">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#cancelNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="cancelNav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{% url 'boutique' %}">Boutique</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'cart' %}"><i class="fa fa-shopping-bag"></i> Panier</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="py-5" style="background-color: #f8f3ed; min-height: 70vh;">
  <div class="container text-center">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 520px;">
      <div class="card-body p-5">
        <div class="mb-3 text-warning">
          <i class="fa fa-exclamation-triangle fa-3x"></i>
        </div>
        <h1 class="fw-bold mb-3">Paiement annulé</h1>
        <p class="text-muted mb-4">Votre paiement a été annulé. Vous pouvez réessayer ou modifier votre panier avant de payer.</p>
        <div class="d-flex justify-content-center gap-2">
          <a class="btn btn-outline-dark" href="{% url 'cart' %}">Retour au panier</a>
          <a class="btn btn-dark" href="{% url 'checkout' %}">Relancer le paiement</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
